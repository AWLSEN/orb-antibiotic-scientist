name: Deploy VPS API

# Pushes dashboard/vercel/api/state.py + deploy/vps/serve.py to
# /opt/antibiotic-api/ on the orbcloud.dev VPS and restarts the
# antibiotic-api systemd service. Atomic swap with rollback on failure.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/vercel/api/state.py'
      - 'deploy/vps/serve.py'
      - 'deploy/vps/antibiotic-api.service'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Syntax check + push
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # Sanity check both files parse on the runner before shipping.
          python3 -m py_compile dashboard/vercel/api/state.py
          python3 -m py_compile deploy/vps/serve.py
          # Stage to .new so the swap below is atomic.
          scp -o IdentitiesOnly=yes dashboard/vercel/api/state.py \
            "$USER@$HOST:/opt/antibiotic-api/state.py.new"
          scp -o IdentitiesOnly=yes deploy/vps/serve.py \
            "$USER@$HOST:/opt/antibiotic-api/serve.py.new"

      - name: Atomic swap and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o IdentitiesOnly=yes "$USER@$HOST" '
            set -e
            cp /opt/antibiotic-api/state.py /opt/antibiotic-api/state.py.bak
            cp /opt/antibiotic-api/serve.py /opt/antibiotic-api/serve.py.bak
            mv /opt/antibiotic-api/state.py.new /opt/antibiotic-api/state.py
            mv /opt/antibiotic-api/serve.py.new /opt/antibiotic-api/serve.py
            chown antibiotic-api:antibiotic-api /opt/antibiotic-api/state.py /opt/antibiotic-api/serve.py
            systemctl restart antibiotic-api
            sleep 2
            if systemctl is-active antibiotic-api > /dev/null 2>&1; then
              echo "OK antibiotic-api restarted"
              rm /opt/antibiotic-api/state.py.bak /opt/antibiotic-api/serve.py.bak
            else
              echo "FAIL — rolling back"
              mv /opt/antibiotic-api/state.py.bak /opt/antibiotic-api/state.py
              mv /opt/antibiotic-api/serve.py.bak /opt/antibiotic-api/serve.py
              systemctl restart antibiotic-api
              journalctl -u antibiotic-api --no-pager -n 30
              exit 1
            fi
          '

      - name: Smoke test
        run: |
          set -euo pipefail
          echo "--- local :8091 ---"
          ssh -o IdentitiesOnly=yes ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "curl -fsS -m 10 -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:8091/api/state"
          echo "--- public /use-cases/antibiotic-scientist/api/state ---"
          code=$(curl -s -m 10 -o /tmp/state -w "%{http_code}" \
            https://orbcloud.dev/use-cases/antibiotic-scientist/api/state)
          if [ "$code" != "200" ]; then
            echo "Expected 200, got $code"
            head -c 500 /tmp/state
            exit 1
          fi
          # Must contain a timestamp field to prove state.py ran.
          if ! python3 -c "import json; d=json.load(open('/tmp/state')); assert 'timestamp' in d"; then
            echo "/api/state response missing timestamp"
            head -c 500 /tmp/state
            exit 1
          fi
          echo "public path OK"
