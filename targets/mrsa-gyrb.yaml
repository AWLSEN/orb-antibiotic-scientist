# Target spec: Staphylococcus aureus DNA gyrase B, ATPase domain
# ----------------------------------------------------------------
# Used by:
#   - src/tools/dock_vina.py (binding box computed from pocket residues on PDB)
#   - src/tools/mechanism.py (PLIP interaction fingerprint; must contact catalytic set)
#   - src/tools/novelty.py (scaffold-class filter; reject re-derivatives of references)
#   - loops/positive_control.py (re-dock reference_inhibitors every hour)
#   - loops/negative_control.py (DUD-E GyrB decoys)
# ----------------------------------------------------------------

id: mrsa-gyrb
status: active
priority: 1

organism:
  name: "Staphylococcus aureus"
  strain: "methicillin-resistant (MRSA)"
  ncbi_taxid: 1280
  who_priority: "High (2024 WHO BPPL)"

target:
  gene: gyrB
  protein: "DNA gyrase subunit B (ATPase domain)"
  ec_number: "5.6.2.2"
  function: >-
    ATP-dependent type-IIA topoisomerase; introduces negative supercoils into
    DNA. The N-terminal 24 kDa ATPase domain is the canonical small-molecule
    target (distinct from GyrA, which binds fluoroquinolones).
  uniprot:
    primary: "P66937"          # S. aureus GyrB (full length)
    notes: "ATPase domain ~residues 1-220 of mature chain."

structure:
  pdb_ids:
    - id: "4URL"
      resolution_a: 2.10
      ligand: "NBTI (novel bacterial topoisomerase inhibitor)"
      preferred_docking_receptor: true
    - id: "3G7B"
      resolution_a: 2.30
      ligand: "Novobiocin-class"
    - id: "3G7E"
      resolution_a: 2.10
      ligand: "Clorobiocin"
    - id: "5CPH"
      resolution_a: 2.35
      ligand: "Aminobenzimidazole"
  chain_for_docking: "A"
  receptor_prep:
    remove_waters: true
    remove_cofactors: true          # remove any co-crystal ligand before docking
    add_hydrogens: true
    protonation_ph: 7.4

binding_pocket:
  description: "ATP-binding pocket of the GyrB ATPase domain."
  # Residue numbers are S. aureus GyrB (UniProt P66937). Cross-check against
  # the specific PDB before docking — some structures use truncated numbering.
  pocket_residues:
    - { resnum: 43,  name: "Val", role: "hydrophobic_wall" }
    - { resnum: 46,  name: "Asn", role: "catalytic_hbond" }    # adenine H-bond
    - { resnum: 50,  name: "Glu", role: "catalytic" }
    - { resnum: 51,  name: "Ile", role: "hydrophobic_wall" }
    - { resnum: 71,  name: "Val", role: "hydrophobic_wall" }
    - { resnum: 73,  name: "Asp", role: "catalytic" }          # critical
    - { resnum: 76,  name: "Arg", role: "electrostatic" }
    - { resnum: 77,  name: "Gly", role: "backbone_only" }
    - { resnum: 117, name: "Thr", role: "hbond" }
    - { resnum: 165, name: "Thr", role: "hbond" }
  required_contacts:
    minimum: 2
    must_include_any_of: [46, 50, 73, 76]    # mechanism.py rejects if fewer hit
  catalytic_residues: [46, 50, 73, 76]        # mechanism analysis weights these
  grid_box:
    # Grid box is computed at docking time from the pocket residue centroid
    # (src/tools/dock_vina.py::pocket_box), NOT hard-coded here — different
    # PDB structures have different coordinate frames and hard-coding drifts.
    mode: "centroid_of_residues"
    padding_a: 8.0
    side_length_a: 22.0

reference_inhibitors:
  # These are the positive controls. loops/positive_control.py re-docks them
  # hourly; their Vina ΔG must remain within 1.5 kcal/mol of the long-run mean,
  # and their rank among recent candidates must stay in the top 5%.
  # A drop outside these bounds halts the agent and alerts the operator.
  - name: "novobiocin"
    # Full novobiocin (aglycone + noviose sugar). Contains the 3-amido-4-
    # hydroxycoumarin moiety that the aminocoumarin scaffold SMARTS matches.
    smiles: "CC1(C)OC2C(OC(=O)N)C(OC)C(Oc3ccc(C(=O)Nc4c(O)c5cc(CC=C(C)C)c(O)cc5oc4=O)cc3C)OC2O1"
    ki_nm: 50
    assay: "S. aureus GyrB ATPase inhibition"
    pubchem_cid: 54675769
    notes: "Formerly FDA-approved (Albamycin); withdrawn 2011. Canonical GyrB probe."
  - name: "clorobiocin"
    smiles: "CC=C(C)CC1=C(OC2=C(C1=O)C(=C(C=C2)OC)C(=O)NC3=C(C=C(C=C3OC)OC)OC4C(C(C(C(O4)(C)C)O)OC(=O)C5=CC=C(N5C)C)OC)Cl"
    ki_nm: 30
    assay: "S. aureus GyrB ATPase inhibition"
    pubchem_cid: 54676228
  - name: "GSK299423"
    smiles: "CC1(C)CCCN(Cc2cnc3[nH]cnc3c2)CC1c1ccc2[nH]nc(C)c2c1"
    ki_nm: 15
    assay: "Bacterial topoisomerase (NBTI)"
    notes: "GlaxoSmithKline novel bacterial topoisomerase inhibitor. Binds DNA-cleavage site, not ATP pocket — include as negative-pocket control."
  - name: "AZD5099"
    smiles: "Cc1ccc(-c2ccc3[nH]c(C(=O)NC4CCN(C)CC4)nc3c2)cc1"
    ki_nm: 22
    assay: "S. aureus GyrB ATPase inhibition"
    notes: "AstraZeneca GyrB inhibitor, reached Phase I."
  - name: "coumermycin A1"
    smiles: ""  # too large for a single SMILES line; see PubChem CID 54662502
    pubchem_cid: 54662502
    ki_nm: 8
    notes: "Natural aminocoumarin; potent but poor drug-like properties."

resistance_hotspots:
  # Mutations known to confer resistance in the wild or in lab-evolved strains.
  # Candidates binding *exclusively* to these residues are demoted — resistance
  # evolves quickly.
  single_site:
    - { resnum: 85,  mutation: "Gly→Ser", drug_class: "aminocoumarin" }
    - { resnum: 136, mutation: "Arg→Leu", drug_class: "aminocoumarin" }
    - { resnum: 128, mutation: "Ser→Thr", drug_class: "NBTI" }
  preferred_mechanism:
    description: >-
      Favour candidates that contact multiple catalytic residues AND at least
      one hydrophobic-wall residue, so a single point mutation is less likely
      to abolish binding.

novelty:
  # novelty.py enforces these.
  tanimoto_threshold: 0.40
  reference_library: "chembl"
  fingerprint: "morgan_r2_2048"
  scaffold_class_blocklist:
    # Reject candidates that are obvious re-derivatives of known antibiotic
    # scaffolds. novelty.py does substructure matching against these SMARTS.
    # All patterns tested against known members of each class (see
    # tests/test_novelty.py).
    - name: "beta_lactam_core"
      smarts: "N1C(=O)CC1"
      matches: "penicillins, cephalosporins, carbapenems, monobactams"
    - name: "fluoroquinolone_core"
      smarts: "O=c1ccn([*])c2ccccc12"
      matches: "ciprofloxacin, moxifloxacin, levofloxacin, norfloxacin"
    - name: "aminocoumarin_3_amide"
      smarts: "O=c1oc2ccccc2c(O)c1NC=O"
      matches: "novobiocin, clorobiocin, coumermycin"
    - name: "aminoglycoside_aminosugar"
      smarts: "[NX3;H2,H1;!$(NC=O)][CX4;R][CX4;R][CX4;R]O[CX4;R][CX4;R]"
      matches: "kanamycin, gentamicin, streptomycin (2-aminosugar in pyranose)"
    # Tetracycline/naphthacene core is intentionally omitted from v1 — a
    # reliable SMARTS for the 4-fused-ring system with correct saturation
    # pattern is brittle. Tetracycline-class rediscovery is also unlikely
    # from de novo small-molecule design. Add in a future commit if needed.

admet_gates:
  # Red-flag filters in src/tools/admet.py. Any flag fails Layer 8.
  lipinski:
    max_mw: 500
    max_logp: 5.0
    max_hbd: 5
    max_hba: 10
  veber:
    max_tpsa: 140
    max_rotatable_bonds: 10
  toxicity:
    protox_class_floor: 4        # reject classes 1-3 (highly toxic)
    ames_mutagen: "must_be_negative"
    herg_blocker: "must_be_negative"
    hepatotox: "must_be_negative"
  pharmacokinetics:
    oral_bioavailability_pct_min: 20

docking:
  primary:
    engine: "autodock_vina"
    exhaustiveness: 32
    num_modes: 20
    seed: 42
    delta_g_threshold_kcalmol: -8.0
  secondary:
    engine: "diffdock"
    num_inference_steps: 20
    consensus_rmsd_a: 2.0        # max pose RMSD vs Vina top pose to count as consensus

synthesizability:
  max_sa_score: 6.0
  retrosynthesis_max_steps: 4
  retrosynthesis_tool: "aizynthfinder"

scoring:
  # Composite rigor score. See src/scoring.py.
  weights:
    docking_vina: 0.30
    novelty: 0.25
    druglikeness: 0.15
    admet: 0.15
    synthesizability: 0.10
    mechanism: 0.05
  leaderboard_threshold: 0.83    # rigor score below this is not publishable

literature:
  search_terms:
    - "gyrase B inhibitor"
    - "GyrB ATPase"
    - "NBTI topoisomerase"
    - "aminocoumarin"
    - "MRSA antibiotic"
    - "S. aureus DNA gyrase"
  bioarxiv_refresh_days: 7
