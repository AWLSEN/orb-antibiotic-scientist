# Orb Cloud deploy config for orb-antibiotic-scientist.
# Deployed via scripts/orb_deploy.sh using the API at api.orbcloud.dev.

[agent]
name  = "orb-antibiotic-scientist"
lang  = "python"
entry = "src/agent.py"

[source]
git    = "https://github.com/nextbysam/orb-antibiotic-scientist"
branch = "main"

[build]
# Build steps run in the Orb build container at repo root. They install
# RDKit + Meeko + the Claude Agent SDK + PyYAML. AutoDock Vina is
# expected on the runtime image; if absent, `conda install -c bioconda
# autodock-vina openbabel` at build time would be appropriate, but we
# prefer thin build steps that rely on the base image.
steps = [
    "pip install --upgrade pip",
    "pip install -r requirements.txt",
    "pip install anthropic",
    "mkdir -p data/pdb-cache data/chembl-cache data/dud-e findings/loop-health findings/candidates findings/red-team findings/weekly-reports",
]

[llm]
# The agent talks to the Anthropic API surface. For the default
# configuration that routes through the Z.AI GLM Coding Plan (cheaper
# ~$10/mo flat vs pay-as-you-go on Anthropic) we set base_url to Z.AI's
# Anthropic-compatible endpoint; the Agent SDK / Claude Code under the
# hood picks up ANTHROPIC_BASE_URL + ANTHROPIC_AUTH_TOKEN below.
# Override via orb_deploy.sh --provider anthropic to switch back to
# the native Anthropic API.
base_url = "https://api.z.ai/api/anthropic"
model    = "claude-opus-4-7"   # Z.AI remaps to GLM-4.7 via ANTHROPIC_DEFAULT_OPUS_MODEL

[ports]
# Future dashboard + webhook endpoint. The agent itself doesn't serve
# HTTP yet, but exposing 8000 makes sure the dashboard's server-side
# renderer can read findings/ over the Orb file API.
expose = [8000]

[resources]
# Docking + RDKit + auto-compacting Claude session needs headroom.
# Checkpoint-to-NVMe during LLM waits (Orb's sleep/wake) means the
# effective cost is much lower than the listed runtime.
runtime = "4GB"
disk    = "10GB"

[agent.env]
# Orb injects this section into the agent process env. Bare strings are
# literal; "${VAR}" placeholders are filled from org_secrets at deploy
# time. Substring interpolation ("Bearer ${VAR}") is NOT supported.
PYTHONUNBUFFERED                = "1"
ORB_ANTIBIOTIC_TARGET           = "targets/mrsa-gyrb.yaml"

# Z.AI GLM Coding Plan routing — literal values (non-secret).
ANTHROPIC_BASE_URL              = "https://api.z.ai/api/anthropic"
API_TIMEOUT_MS                  = "3000000"
ANTHROPIC_DEFAULT_OPUS_MODEL    = "GLM-4.7"
ANTHROPIC_DEFAULT_SONNET_MODEL  = "GLM-4.7"
ANTHROPIC_DEFAULT_HAIKU_MODEL   = "GLM-4.5-Air"

# Secret: MUST use the "${NAME}" placeholder form. Orb validates every
# placeholder has a matching org_secrets entry on the /agents start
# request and 400s the deploy otherwise, so only declare placeholders
# for secrets we actually pass.
#
# For Z.AI (default), ANTHROPIC_AUTH_TOKEN is the Z.AI key.
# For native Anthropic, the deploy script aliases the same placeholder
# to the Anthropic key — Claude Code accepts either env var name.
ANTHROPIC_AUTH_TOKEN            = "${ANTHROPIC_AUTH_TOKEN}"
